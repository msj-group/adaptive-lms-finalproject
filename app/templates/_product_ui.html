{# Presentation primitives only. Callers supply existing server values/actions. #}
{% import '_figma_ui.html' as ui %}
{% macro workspace_heading(title, date=none) -%}
<header class="workspace-heading"><div><h1 data-workspace-page-heading>{{ _(title) }}</h1>{% if date %}<time class="workspace-meta">{{ ui_date(date) }}</time>{% endif %}</div>{% if caller is defined %}<div class="yc-actions">{{ caller() }}</div>{% endif %}</header>
{%- endmacro %}
