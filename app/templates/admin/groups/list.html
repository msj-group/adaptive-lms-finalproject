{% extends "layouts/admin_base.html" %}
{% import "admin/_macros.html" as macros %}
{% block title %}Groups{% endblock %}
{% block admin_content %}
<div class="ds-page yc-surface">
  <div class="ds-row yc-actions" style="justify-content: space-between; align-items: center; margin-bottom: var(--space-6)">
    <h1 data-workspace-page-heading style="margin:0">Groups</h1>
    <a class="btn btn--primary" href="{{ url_for('admin.group_create') }}">New Group</a>
  </div>

  {{ macros.flash_messages() }}

  <form method="get" class="ds-row yc-actions yc-filter-form" style="margin-bottom: var(--space-4); align-items:center; gap: var(--space-2); flex-wrap: wrap;" data-query-form data-query-results="query-results" data-query-min="0">
    <label class="field__label" for="q" style="margin:0">Search:</label>
    <input type="search" name="q" id="q" class="field__input" style="width:auto" placeholder="Group name or code" value="{{ search }}" maxlength="100">

    <label class="field__label" for="term_id" style="margin:0">Term:</label>
    <select name="term_id" id="term_id" class="field__input" style="width:auto">
      <option value="">All Terms</option>
      {% for term in terms %}
        <option value="{{ term.id }}" {{ "selected" if selected_term_id == term.id else "" }}>{{ term.name }}</option>
      {% endfor %}
    </select>

    <label class="field__label" for="course_id" style="margin:0">Course:</label>
    <select name="course_id" id="course_id" class="field__input" style="width:auto">
      <option value="">All Courses</option>
      {% for course in courses %}
        <option value="{{ course.id }}" {{ "selected" if selected_course_id == course.id else "" }}>{{ course.title }}</option>
      {% endfor %}
    </select>

    <label class="field__label" for="level_id" style="margin:0">Level:</label>
    <select name="level_id" id="level_id" class="field__input" style="width:auto">
      <option value="">All Levels</option>
      {% for level in levels %}
        <option value="{{ level.id }}" {{ "selected" if selected_level_id == level.id else "" }}>{{ level.name }}</option>
      {% endfor %}
    </select>

    <label class="field__label" for="status" style="margin:0">Status:</label>
    <select name="status" id="status" class="field__input" style="width:auto">
      <option value="">All Statuses</option>
      <option value="active" {{ "selected" if selected_status == "active" else "" }}>Active</option>
      <option value="archived" {{ "selected" if selected_status == "archived" else "" }}>Archived</option>
    </select>

    <button data-query-submit type="submit" class="btn btn--secondary">Filter</button>

      <a class="btn btn--secondary" href="{{ url_for('admin.groups_list') }}">Clear</a>

  </form><div id="query-results">{% include "admin/groups/_query_results.html" %}</div></div>
<script>
  document.querySelectorAll(".group-status-form[data-confirm]").forEach(function (form) {
    form.addEventListener("submit", function (event) {
      if (!window.aelmsConfirm && !confirm(form.dataset.confirm)) {
        event.preventDefault();
      }
    });
  });
</script>
{% endblock %}
