<dialog class="fp-dialog" data-planner-dialog aria-labelledby="planner-dialog-title">
  <header class="fp-dialog-heading"><div><p class="fp-meta">Calendar</p><h2 id="planner-dialog-title" data-planner-dialog-title>Calendar</h2></div><button type="button" class="fp-icon-link" data-planner-close aria-label="Close">{{ planner_ui.icon('close',18) }}</button></header>
  <button type="button" class="fp-link fp-dialog-back" data-planner-back hidden>{{ planner_ui.icon('chevron',14) }} Choose another group</button>
  <p class="fp-dialog-status" data-planner-status role="status" aria-live="polite" hidden></p>
  <div data-planner-dialog-messages></div><div data-planner-dialog-content></div>
  <footer class="fp-dialog-recovery" data-planner-recovery hidden><button type="button" class="btn btn--secondary" data-planner-retry>Retry</button><a class="fp-link" data-planner-native>Open full page</a></footer>
</dialog>
