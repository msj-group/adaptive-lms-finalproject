<dialog class="pf-create-dialog pf-action-dialog" id="people-action-dialog" data-people-action-dialog data-people-kind="{{ people_kind }}" data-people-actor="{{ current_user.public_id }}:{{ current_user.auth_version }}:{{ current_user.role }}" data-message-new-url="{{ url_for('messages.new_thread') }}" data-thread-url="{{ url_for('messages.thread', thread_public_id='__thread__') }}" aria-labelledby="people-action-title">
  <header class="pf-create-head"><div><p class="ad-eyebrow">People</p><h2 id="people-action-title" data-people-action-title>Edit profile</h2><p class="ad-meta pf-action-person" data-people-action-person dir="auto"></p></div><button class="btn btn--ghost" type="button" data-people-action-close aria-label="Close">{{ ui.icon('close', 19) }}</button></header>
  <div class="pf-create-body"><p class="pf-create-status" data-people-action-status role="status" aria-live="polite"></p><div data-people-action-content></div></div>
  <footer class="pf-create-recovery" data-people-action-recovery hidden><button class="btn btn--secondary" type="button" data-people-action-retry>Retry</button><a class="ad-row-link" data-people-action-fallback>Open full page {{ ui.icon('arrow-up', 14) }}</a></footer>
</dialog>
