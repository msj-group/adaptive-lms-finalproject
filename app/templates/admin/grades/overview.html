{% extends 'admin/learning/_base.html' %}
{% block title %}Grades{% endblock %}
{% block learning_content %}
<div class="al-tools"><header><h2>Gradebook setup</h2><p>Review category weights and item states.</p></header>
  <details class="al-filters"{% if filter_group or filter_term or filter_configured %} open{% endif %}><summary>{{ learning_ui.icon('settings',16) }} Filters</summary>
    <form method="get" class="al-filter-form" data-query-form data-query-results="query-results" data-query-min="0">
      <div class="field"><label for="group">Group</label><select name="group" id="group" class="field__input"><option value="">All groups</option>{% set choices = workspace_group_choices() %}{% set found = namespace(value=false) %}{% for row in choices %}{% if filter_group == row.public_id %}{% set found.value=true %}{% endif %}<option value="{{ row.public_id }}" {{ 'selected' if filter_group == row.public_id else '' }}>{{ row.name }} · {{ row.title }} · {{ row.term_name }}</option>{% endfor %}{% if filter_group and not found.value %}<option value="{{ filter_group }}" selected>Selected group (outside the first 500 choices)</option>{% endif %}</select></div>
      <div class="field"><label for="term">Academic term</label><select name="term" id="term" class="field__input"><option value="">All terms</option>{% for term in terms %}<option value="{{ term.id }}" {{ 'selected' if filter_term == term.id else '' }}>{{ term.name }}</option>{% endfor %}</select></div>
      <div class="field"><label for="configured">Weights</label><select name="configured" id="configured" class="field__input"><option value="">Any</option><option value="complete" {{ 'selected' if filter_configured == 'complete' else '' }}>Exactly 100%</option><option value="incomplete" {{ 'selected' if filter_configured == 'incomplete' else '' }}>Not yet 100%</option></select></div>
      <div class="al-filter-actions"><button data-query-submit type="submit" class="btn btn--primary">Filter</button><a class="btn" href="{{ url_for('admin.gradebook_overview') }}">Clear</a></div>
    </form>
  </details>
</div>
<div id="query-results">{% include 'admin/grades/_query_results.html' %}</div>
{% endblock %}
