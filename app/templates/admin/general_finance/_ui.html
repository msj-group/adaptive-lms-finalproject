{% macro messages() -%}
{% for category,message in get_flashed_messages(with_categories=true) %}
{% set completed = {'finance-saved-new': 'new', 'finance-saved-correct': 'correct'}.get(category) %}
<div class="alert alert--{{ 'success' if completed else category }}" role="status"{% if completed %} data-finance-completed="{{ completed }}"{% endif %}>{{ _(message) }}</div>
{% endfor %}
{%- endmacro %}
