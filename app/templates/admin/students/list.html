{% extends "layouts/admin_base.html" %}
{% import "admin/_macros.html" as macros %}
{% block title %}Students{% endblock %}
{% block admin_content %}
<div class="ds-page yc-surface"
>
  <div class="ds-row yc-actions" style="justify-content: space-between; align-items: center; margin-bottom: var(--space-6)">
    <h1 data-workspace-page-heading style="margin:0">Students</h1>
    <a class="btn btn--primary" href="{{ url_for('admin.student_create') }}">New Student</a>
  </div>

  {{ macros.flash_messages() }}

  <form method="get" id="student-filter-form" class="ds-row yc-actions yc-filter-form" style="margin-bottom: var(--space-2); align-items:center; gap: var(--space-2); flex-wrap: wrap;" data-query-form data-query-results="student-results" data-query-min="0" data-query-history="replace">
    <label class="field__label" for="q" style="margin:0">Search:</label>
    <input type="search" name="q" id="q" class="field__input" style="width:auto" placeholder="Full name or email" value="{{ search }}" autocomplete="off">

    <label class="field__label" for="status" style="margin:0">Status:</label>
    <select name="status" id="status" class="field__input" style="width:auto">
      <option value="">All Statuses</option>
      <option value="active" {{ "selected" if selected_status == "active" else "" }}>Active</option>
      <option value="suspended" {{ "selected" if selected_status == "suspended" else "" }}>Suspended</option>
    </select>


      <button data-query-submit type="submit" class="btn btn--secondary">Filter</button>

  </form>

  <div id="student-results">
    {% include "admin/students/_results.html" %}
  </div>
</div>

{% endblock %}
