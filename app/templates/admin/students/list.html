{% extends "layouts/admin_base.html" %}
{% import "admin/_macros.html" as macros %}
{% block title %}Students{% endblock %}
{% block admin_content %}
<div class="ds-page"
     data-live-search
     data-list-url="{{ url_for('admin.students_list') }}"
     data-singular="student"
     data-plural="students"
     data-status-form-selector=".student-status-form[data-confirm]"
>
  <div class="ds-row" style="justify-content: space-between; align-items: center; margin-bottom: var(--space-6)">
    <h1 style="margin:0">Students</h1>
    <a class="btn btn--primary" href="{{ url_for('admin.student_create') }}">New Student</a>
  </div>

  {{ macros.flash_messages() }}

  <form method="get" id="student-filter-form" data-live-search-form class="ds-row" style="margin-bottom: var(--space-2); align-items:center; gap: var(--space-2); flex-wrap: wrap;">
    <label class="field__label" for="q" style="margin:0">Search:</label>
    <input type="search" name="q" id="q" data-live-search-input class="field__input" style="width:auto" placeholder="Full name or email" value="{{ search }}" autocomplete="off">

    <label class="field__label" for="status" style="margin:0">Status:</label>
    <select name="status" id="status" data-live-search-status class="field__input" style="width:auto">
      <option value="">All Statuses</option>
      <option value="active" {{ "selected" if selected_status == "active" else "" }}>Active</option>
      <option value="suspended" {{ "selected" if selected_status == "suspended" else "" }}>Suspended</option>
    </select>

    <noscript>
      <button type="submit" class="btn btn--secondary">Filter</button>
    </noscript>
  </form>

  <div id="student-search-status" data-live-search-status-region role="status" aria-live="polite" style="min-height: 1.25em; color: var(--color-text-secondary); font-size: var(--font-size-sm); margin-bottom: var(--space-4)"></div>

  <div id="student-results" data-live-search-results>
    {% include "admin/students/_results.html" %}
  </div>
</div>
<script src="{{ url_for('static', filename='js/admin_live_search.js') }}" defer></script>
{% endblock %}
