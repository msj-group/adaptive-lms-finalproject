{% extends "student/announcements/base.html" %}
{% block title %}{{ announcement.title }}{% endblock %}
{% block portal_content %}
<div class="announcement-workspace" data-announcement-workspace>
  <header class="announcement-page-heading"><h1 data-workspace-page-heading>Announcements</h1></header>
  {{ ann.flash_messages() }}
  <a class="announcement-back announcement-page-back" href="{{ url_for('student.announcements_list', page=page) }}">{{ ui.icon('arrow', 17) }}<span>All announcements</span></a>
  <div class="announcement-read-page">{% include "student/announcements/_reader.html" %}</div>
</div>
{% endblock %}
