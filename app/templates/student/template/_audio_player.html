{# Keep the exact authored playback choices and authorized source. #}
{% import 'curriculum/_media.html' as custom_media %}
{% set rates=player.rates|default(['0.75','1','1.25','1.5']) %}
<div class="listening-player{% if audio_compact|default(false) %} listening-player--compact{% else %} st-panel{% endif %}" data-audio-player>
  {% if not audio_compact|default(false) %}<h2 class="card__title">Recording</h2>{% endif %}
  <div class="course-media" data-course-media data-media-kind="audio"><audio data-audio-element controls controlslist="noplaybackrate nodownload" preload="metadata" src="{{ player.src }}" aria-label="{{ _('Audio recording for %(name)s',name=player.label) }}" data-research-media="listening_audio">{{ _('Your browser cannot play audio here.') }} <a href="{{ player.src }}">Open the recording</a>.</audio>{{ custom_media.controls(rates) }}</div>
</div>
<script src="{{ url_for('static',filename='js/audio_player.js',v='shared-compact-player-1') }}" defer></script>
