{# Authorized audio URL, label and finite authored playback rates only. #}
{% set rates = player.rates|default(['0.75','1','1.25','1.5']) %}
<div class="listening-player{% if audio_compact|default(false) %} listening-player--compact{% else %} st-panel{% endif %}" data-audio-player>
  {% if not audio_compact|default(false) %}<h2 class="card__title">Recording</h2>{% endif %}
  <div class="listening-audio-strip">
    <audio data-audio-element controls controlslist="noplaybackrate nodownload" preload="metadata" src="{{ player.src }}" aria-label="Audio recording for {{ player.label }}" data-research-media="listening_audio">
      Your browser cannot play audio here. <a href="{{ player.src }}">Open the recording</a>.
    </audio>
    {% if rates|length > 1 %}<div data-audio-controls hidden><label class="sr-only" for="listening-speed">Speed</label><select id="listening-speed" aria-label="Playback speed" data-audio-speed-select data-research-id="audio_speed">{% for rate in rates %}<option value="{{ rate }}" {% if rate == '1' %}selected{% endif %}>{{ rate }}×</option>{% endfor %}</select></div>{% endif %}
  </div>
</div>
<script src="{{ url_for('static', filename='js/audio_player.js', v='authored-speeds-20261013') }}" defer></script>
