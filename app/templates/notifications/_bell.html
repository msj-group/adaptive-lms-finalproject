<div class="notif-bell" data-notification-bell data-preview-url="{{ url_for('notifications.preview') }}">
  <button class="figma-icon-button figma-notification" type="button" aria-label="{{ _('Notifications, %(count)s unread', count=notif.unread_count) if notif.unread_count else _('Notifications') }}" aria-controls="notification-preview" aria-expanded="false" aria-haspopup="dialog" data-notification-toggle data-research-id="nav_notifications" hidden>{{ ui.icon('bell') }}{% if notif.unread_count %}<i aria-hidden="true"></i>{% endif %}</button>
  <noscript><a class="figma-icon-button figma-notification" href="{{ url_for('notifications.inbox') }}" aria-label="Notifications">{{ ui.icon('bell') }}</a></noscript>
  <section class="notif-preview" id="notification-preview" role="dialog" aria-labelledby="notification-preview-title" data-notification-preview hidden>
    <div class="notif-preview-heading"><h2 id="notification-preview-title" tabindex="-1">Notifications</h2><div class="notif-preview-actions">
      <button class="figma-icon-button" type="button" data-notification-retry aria-label="Try again" title="Try again" hidden><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M6 7a7 7 0 0 1 12-1l2 6M4 12l2 6a7 7 0 0 0 12-1"/></svg></button>
      <form class="notif-preview-mark-all" data-notification-read-all method="post" action="{{ url_for('notifications.read_all') }}" data-research-form="notification_read_all"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="filter" value="all"><input type="hidden" name="page" value="1"><input type="hidden" name="kind" value=""><button type="submit" class="figma-icon-button" data-research-id="notification_read_all" aria-label="Mark all as read" title="Mark all as read"{% if not notif.unread_count %} disabled{% endif %}>{{ ui.icon('check',18) }}<span class="notif-action-label">Mark all as read</span></button></form>
      <a class="figma-icon-button" href="{{ url_for('notifications.inbox') }}" aria-label="View all notifications" title="View all notifications">{{ ui.icon('arrow-up',18) }}<span class="notif-action-label">View all</span></a>
      <button class="figma-icon-button" type="button" aria-label="Close notifications" title="Close notifications" data-notification-close>{{ ui.icon('close',18) }}</button>
    </div></div>
    <div data-notification-preview-body aria-live="polite"></div>
  </section>
</div>
