<div class="notif-bell" data-notification-bell data-preview-url="{{ url_for('notifications.preview') }}">
  <button class="figma-icon-button figma-notification" type="button" aria-label="{{ _('Notifications, %(count)s unread', count=notif.unread_count) if notif.unread_count else _('Notifications') }}" aria-controls="notification-preview" aria-expanded="false" aria-haspopup="dialog" data-notification-toggle data-research-id="nav_notifications" hidden>{{ ui.icon('bell') }}{% if notif.unread_count %}<i aria-hidden="true"></i>{% endif %}</button>
  <noscript><a class="figma-icon-button figma-notification" href="{{ url_for('notifications.inbox') }}" aria-label="Notifications">{{ ui.icon('bell') }}</a></noscript>
  <section class="notif-preview" id="notification-preview" role="dialog" aria-labelledby="notification-preview-title" data-notification-preview hidden>
    <div class="notif-preview-heading"><div><span class="st-eyebrow">YOUR UPDATES</span><h2 id="notification-preview-title" tabindex="-1">Notifications</h2></div><button class="figma-icon-button" type="button" aria-label="Close notifications" data-notification-close>{{ ui.icon('close') }}</button></div>
    <div data-notification-preview-body aria-live="polite"></div>
    <a class="notif-preview-all" href="{{ url_for('notifications.inbox') }}">More notifications {{ ui.icon('arrow', 17) }}</a>
  </section>
</div>
