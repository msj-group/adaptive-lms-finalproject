{% import '_figma_ui.html' as ui %}
{% set hub_endpoint = 'teacher.activities' if teacher else 'student.activities' %}

<details class="activity-filters"><summary>{{ ui.icon('settings',18) }} {{ _('Filters') }}</summary>
<form method="get" action="{{ url_for(hub_endpoint) }}" class="activity-hub-filters" data-query-form data-query-results="query-results" data-query-min="0">
<div class="field"><label for="activity-type">{{ _('Activity type') }}</label><select id="activity-type" name="type"{% if not teacher %} data-research-id="activity_filter"{% endif %}><option value="">{{ _('All activities') }}</option>{% for kind,label in types.items() %}<option value="{{ kind }}"{% if selected_type == kind %} selected{% endif %}>{{ label }}</option>{% endfor %}</select></div>
<div class="field">
<label for="state">{{ _('Publication' if teacher else 'Progress & availability') }}</label>
<select id="state" name="state"{% if not teacher %} data-research-id="activity_filter"{% endif %}>
<option value="">All states</option>{% for key,label in states.items() %}<option value="{{ key }}"{% if selected_state == key %} selected{% endif %}>{{ label }}</option>{% endfor %}</select>
</div>
<div class="field">
<label for="course">Course</label>
<select id="course" name="course"{% if not teacher %} data-research-id="activity_filter"{% endif %}>
<option value="">All courses</option>{% for row in courses %}<option value="{{ row.course_public_id }}"{% if selected_course == row.course_public_id %} selected{% endif %}>{{ row.course_title }}</option>{% endfor %}</select>
</div>
<div class="field">
<label for="group">Group</label>
<select id="group" name="group"{% if not teacher %} data-research-id="activity_filter"{% endif %}>
<option value="">All groups</option>{% if hub_group and not groups|selectattr('group_public_id','equalto',selected_group)|list %}<option value="{{ hub_group.public_id }}" selected>{{ hub_group.name }}</option>{% endif %}{% for row in groups %}<option value="{{ row.group_public_id }}"{% if selected_group == row.group_public_id %} selected{% endif %}>{{ row.group_name }}</option>{% endfor %}</select>
</div>
<div class="activity-filter-actions">
<button data-query-submit type="submit" class="btn btn--primary">Apply filters</button>
<a href="{{ url_for(hub_endpoint) }}">Reset filters</a>
</div>
</form></details><div id="query-results">{% include "activities/_results.html" %}</div>
