{% import '_figma_ui.html' as ui %}
<button class="figma-nav-backdrop" type="button" aria-label="Close navigation" data-nav-close hidden></button>
<aside class="st-sidebar figma-sidebar" id="workspace-navigation" aria-label="{{ role|capitalize }} navigation" data-nav-scope="{{ role }}">
  <a class="st-brand" href="{{ url_for(home_endpoint) }}" aria-label="Youth Centre {{ role }} dashboard">
    {{ ui.brand_logo() }}
    <span><strong lang="en" dir="ltr" translate="no">Youth Centre<span>.</span></strong><small>ENGLISH LEARNING PLATFORM</small></span>
  </a>
  <button class="figma-sidebar-close st-icon-button" type="button" aria-label="Close navigation" data-nav-close hidden>{{ ui.icon('close') }}</button>
  <nav class="st-navigation figma-sidebar-nav" aria-label="Primary">
    {% include 'layouts/_product_navigation.html' %}
  </nav>
</aside>
