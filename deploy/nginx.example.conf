# Replace the hostname/certificate paths. Keep the WSGI port private.
server {
    listen 80;
    server_name learn.example.org;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name learn.example.org;
    ssl_certificate /etc/ssl/centre/fullchain.pem;
    ssl_certificate_key /etc/ssl/centre/privkey.pem;
    client_max_body_size 102m;
    client_body_timeout 120s;
    # Private uploads are never an alias/location. Their Flask routes authorize each request.
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 130s;
        proxy_request_buffering on;
    }
    # Exclude client address, query string, user agent and bodies from access logs.
    access_log off;
    error_log /var/log/nginx/centre-error.log warn;
}
